<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
     <link rel="icon" type="image/svg+xml" href="https://hjrm8lbtnby37npy.public.blob.vercel-storage.com/phonto%20%2810%29.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla OM | Luxury Ingredients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      // Shim for process.env
      window.process = window.process || { env: {} };
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
              arabic: ['"Tajawal"', 'sans-serif'],
            },
            colors: {
              gold: {
                50: '#FBF8F1',
                100: '#F5EEDB',
                200: '#EADBB0',
                300: '#DFC886',
                400: '#D4B55C',
                500: '#C9A232',
                600: '#A18228',
                700: '#79611E',
                800: '#504114',
                900: '#28200A',
              },
              stone: {
                850: '#1f1f1e', // Dark charcoal for text
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FBF8F1; /* gold-50 */
        color: #1f1f1e;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
